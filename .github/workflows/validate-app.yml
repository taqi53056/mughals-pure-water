name: Validate app source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse HTML and extract scripts
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from html.parser import HTMLParser

          source = Path("index.html").read_text(encoding="utf-8")

          class AppHTMLParser(HTMLParser):
              pass

          parser = AppHTMLParser(convert_charrefs=False)
          parser.feed(source)
          parser.close()

          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", source, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")

          out = Path("/tmp/mpw-js")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts, 1):
              (out / f"script-{index}.js").write_text(script, encoding="utf-8")
          print(f"HTML parsed; extracted {len(scripts)} JavaScript blocks.")
          PY
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in /tmp/mpw-js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
